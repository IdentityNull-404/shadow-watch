name: Refresh cyber intelligence feed
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch security headlines
        run: python scripts/update_feed.py
      - name: Commit changes if needed
        run: |
          git config user.name "shadow-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh cyber intelligence feed"
            git push
          fi
